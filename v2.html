<!DOCTYPE html>
<!-- build: 2026-05-25-rk-tilt-flipped -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jiayang Wen — Builder · Creator · Investor</title>
<meta name="description" content="Jiayang Wen — building products, painting in oil, and investing with conviction.">
<meta name="theme-color" content="#f3f2ee">
<link rel="icon" type="image/jpeg" href="images/website_icon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f2ee;
  --surface:#ffffff;
  --surface-2:#faf9f6;
  --ink:#141310;
  --ink-2:#37352f;
  --muted:#777269;
  --faint:#a6a298;
  --line:rgba(20,18,12,0.11);
  --line-soft:rgba(20,18,12,0.06);
  --accent:#b4583b;
  --accent-soft:rgba(180,88,59,0.09);
  --serif:'Playfair Display',Georgia,serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.22,.68,.18,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --hdr:64px;
  --maxw:1200px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;letter-spacing:-0.011em;overflow:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
::selection{background:var(--ink);color:var(--bg)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 40px}
.mono{font-family:var(--mono);font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--faint)}

/* reveal */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .85s var(--ease-out),transform .85s var(--ease-out)}
.reveal.in{opacity:1;transform:none}

/* ============ header ============ */
header.hdr{position:fixed;top:0;left:0;right:0;height:var(--hdr);z-index:300;background-color:rgba(243,242,238,0.2);backdrop-filter:saturate(160%) blur(20px);-webkit-backdrop-filter:saturate(160%) blur(20px);border-bottom:1px solid var(--line-soft);transition:background-color .8s var(--ease),border-color .8s var(--ease),backdrop-filter .8s var(--ease),-webkit-backdrop-filter .8s var(--ease)}
/* Builder: full-screen dot bg, header floats transparently */
body.in-builder{background-color:#ecebe5;background-image:radial-gradient(rgba(20,22,40,0.22) 1.3px,transparent 1.5px);background-size:26px 26px}
body.in-builder header.hdr{background-color:transparent;border-bottom-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
/* AI Film: header goes black, brand/tabs/icons fade out, only Exit visible */
body.film-on header.hdr{background-color:#0b0907;border-bottom-color:#0b0907;backdrop-filter:none;-webkit-backdrop-filter:none}
body.film-on .brand,body.film-on .tabs,body.film-on .hdr-right{opacity:0;visibility:hidden;transition:opacity .7s var(--ease),visibility .7s var(--ease)}
.hdr-inner{max-width:var(--maxw);height:100%;margin:0 auto;padding:0 40px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:-0.01em;white-space:nowrap;transition:opacity .45s var(--ease),visibility .45s var(--ease)}
.tabs,.hdr-right{transition:opacity .45s var(--ease),visibility .45s var(--ease)}
.brand b{color:var(--accent)}
.tabs{position:relative;display:flex;gap:4px}
.tab{position:relative;background:none;border:none;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:0.13em;text-transform:uppercase;color:var(--muted);padding:9px 16px;border-radius:999px;transition:color .35s var(--ease),background .35s var(--ease)}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink)}
.tab-ink{position:absolute;left:0;top:50%;height:30px;transform:translateY(-50%);background:rgba(20,18,12,0.06);border:1px solid var(--line);border-radius:999px;transition:transform .5s var(--ease),width .5s var(--ease);pointer-events:none;z-index:-0}
.hdr-right{display:flex;align-items:center;gap:15px}
.soc{display:flex;color:var(--muted);transition:color .3s var(--ease),transform .3s var(--ease)}
.soc:hover{color:var(--accent);transform:translateY(-2px)}
.soc svg{width:18px;height:18px;display:block;fill:currentColor}
@media(max-width:680px){
  .hdr-inner{padding:0 18px;gap:8px}
  .hdr-right{gap:12px}
  .soc svg{width:16px;height:16px}
  .tab{padding:8px 9px;font-size:9.5px;letter-spacing:0.06em}
  .brand{font-size:15px}
}

/* ============ views ============ */
main{position:fixed;top:var(--hdr);left:0;right:0;bottom:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .55s var(--ease-out),transform .55s var(--ease-out),visibility .55s}
.view.active{opacity:1;visibility:visible;transform:none}
.view::-webkit-scrollbar{width:9px}
.view::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:3px solid var(--bg)}
.view-pad{padding:74px 0 110px}

/* view header */
.vhead{margin-bottom:58px}
.vhead .mono{display:block;margin-bottom:16px}
.vhead h1{font-family:var(--serif);font-size:clamp(40px,6.2vw,76px);font-weight:600;line-height:1;letter-spacing:-0.03em}
.vhead h1 em{font-style:italic;color:var(--accent)}
.vhead p{max-width:520px;margin-top:20px;font-size:17px;color:var(--muted);line-height:1.6;font-weight:300}

/* ============ builder ============ */
.proj-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:34px 34px}
.proj{cursor:pointer;outline:none}
.proj:focus-visible .proj-media{box-shadow:0 0 0 2px var(--accent)}
.proj-media{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/10;background:var(--surface-2);border:1px solid var(--line)}
.proj-media img,.proj-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.proj-media video{opacity:0;transition:opacity .5s var(--ease)}
.proj-media .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:54px}
.proj-media img{transform:scale(1.015);transition:transform 1.2s var(--ease-out)}
.proj:hover .proj-media img{transform:scale(1.055)}
.proj.has-video:hover video.ready{opacity:1}
.proj-shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(10,8,6,0.5));opacity:0;transition:opacity .5s var(--ease)}
.proj:hover .proj-shade{opacity:1}
.badge{position:absolute;top:14px;left:14px;z-index:2;font-family:var(--mono);font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;background:rgba(255,255,255,0.94);color:var(--ink);padding:6px 11px;border-radius:999px;display:flex;gap:6px;align-items:center}
.badge.soon{background:rgba(20,18,12,0.07);color:var(--muted)}
.proj-open{position:absolute;right:15px;bottom:14px;z-index:2;color:#fff;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px;opacity:0;transform:translateY(7px);transition:all .45s var(--ease-out)}
.proj:hover .proj-open{opacity:1;transform:none}
.proj-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin:17px 2px 0}
.proj-head h3{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-0.015em}
.proj-head .meta{font-family:var(--mono);font-size:10px;letter-spacing:0.07em;color:var(--faint);text-transform:uppercase;white-space:nowrap}
.proj-sub{margin:5px 2px 0;font-size:14px;color:var(--muted);line-height:1.5}
@media(max-width:760px){.proj-grid{grid-template-columns:1fr;gap:28px}}

/* ============ shared gallery (Builder + Creator) — reference-style ============ */
.view-creator,.view-gallery{overflow:hidden}
.gallery{position:absolute;inset:0;overflow:hidden;cursor:grab;background:var(--bg);transition:background-color .8s var(--ease)}
.gallery::before{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(rgba(20,18,12,0.05) 1.1px,transparent 1.3px);background-size:24px 24px;opacity:.65}
.gallery.drag{cursor:grabbing}
/* giant type: wall behind (g-bg) + crossing letters in front (g-front) */
.g-bg,.g-front{position:absolute;left:0;white-space:nowrap;font-family:var(--sans);font-weight:800;line-height:.78;pointer-events:none;will-change:transform;letter-spacing:-0.012em;text-transform:uppercase}
.g-bg{top:50%;transform:translateY(-50%);font-size:46vh;color:var(--ink);opacity:0.05;z-index:1}
.g-front{bottom:-3vh;font-size:40vh;color:var(--accent);opacity:0.92;z-index:4}
.g-track{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;padding:0 44vw;gap:6vw;will-change:transform;z-index:3;perspective:2400px;perspective-origin:50% 46%}
.g-item{position:relative;flex:0 0 auto;height:var(--bh,60vh);transform:translateY(var(--off,0));cursor:pointer}
.curl{position:relative;height:100%;transform-origin:50% 60%;will-change:transform,opacity;backface-visibility:hidden}
.g-frame{position:relative;height:100%;border-radius:8px;overflow:visible;background:transparent;box-shadow:0 34px 80px rgba(20,16,10,0.24),0 4px 14px rgba(20,16,10,0.10)}
.g-frame img{position:relative;height:100%;width:100%;display:block;object-fit:contain;will-change:transform}
.g-frame.transparent{box-shadow:none;background:transparent}
/* builder project block — media + editorial caption strip */
.g-item.pi{height:46vh;width:calc(46vh * var(--ar,1.4))}
.pcard{position:relative;height:100%;border-radius:6px;overflow:hidden;background:var(--surface-2);box-shadow:0 36px 86px rgba(10,12,30,0.28),0 6px 18px rgba(10,12,30,0.13)}
.pcard img,.pcard video{position:absolute;left:0;right:0;top:0;width:100%;height:calc(100% - 76px);object-fit:cover}
.pcard img{will-change:transform}
.pcard video{opacity:0;transition:opacity .5s var(--ease)}
.g-item.pi.is-center:hover .pcard video.ready{opacity:1}
.pcard .ph{position:absolute;left:0;right:0;top:0;bottom:76px;display:flex;align-items:center;justify-content:center;font-size:72px;background:#e6e4dd}
.pcard-tag{position:absolute;top:14px;left:14px;font-family:var(--mono);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;background:rgba(255,255,255,0.93);color:var(--ink);padding:6px 11px;border-radius:999px;display:flex;gap:6px;align-items:center;z-index:2}
.pcard-tag.soon{background:rgba(20,18,12,0.5);color:#fff}
.pcard-open{position:absolute;right:14px;top:14px;z-index:2;font-family:var(--mono);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;background:rgba(10,10,12,0.8);color:#fff;padding:6px 11px;border-radius:999px;opacity:0;transform:translateY(-4px);transition:all .4s var(--ease)}
.g-item.pi.is-center .pcard-open{opacity:1;transform:none}
.pcard-yt{position:absolute;left:0;right:0;top:0;bottom:76px;z-index:1;background:#000;overflow:hidden;pointer-events:none}
.pcard-yt:empty{display:none}
.pcard-yt iframe{position:absolute;inset:-1px;width:calc(100% + 2px);height:calc(100% + 2px);border:0;display:block;pointer-events:none}
.pcard-cap{position:absolute;left:0;right:0;bottom:0;height:76px;z-index:2;padding:12px 15px 10px;background:rgba(12,10,8,0.92);color:#fff;display:grid;align-content:center;border-top:1px solid rgba(255,255,255,0.08)}
.pcard-cap h3{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:0;line-height:1.06}
.pcard-cap p{font-size:11.5px;color:rgba(255,255,255,0.74);margin-top:4px;line-height:1.28;max-width:92%;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pcard-cap .pc-meta{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:8.5px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.58)}
.g-cap{position:absolute;left:0;top:calc(100% + 10px);display:flex;align-items:baseline;gap:10px;opacity:0;transform:translateY(-4px);transition:opacity .5s var(--ease),transform .5s var(--ease);pointer-events:none}
.g-item.is-center .g-cap{opacity:1;transform:none}
.g-cap h4{font-family:var(--serif);font-size:17px;font-weight:500;font-style:italic}
.g-cap span{font-family:var(--mono);font-size:9.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--faint)}
.g-num{position:absolute;left:2px;top:-30px;font-family:var(--mono);font-size:10px;letter-spacing:0.14em;color:var(--accent);opacity:0;transition:opacity .5s var(--ease)}
.g-item.is-center .g-num{opacity:1}
/* per-center big title that crosses in front (creator) */
.g-bigtitle{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(40px,8vw,108px);color:var(--accent);opacity:0;pointer-events:none;z-index:5;white-space:nowrap;transition:opacity .55s var(--ease)}
.g-bigtitle.show{opacity:1}
/* corner labels + UI */
.g-name{position:absolute;left:40px;bottom:58px;z-index:7;font-family:var(--mono);font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--ink);pointer-events:none}
.g-ui{position:absolute;left:40px;right:40px;bottom:28px;display:flex;align-items:flex-end;justify-content:space-between;z-index:7;pointer-events:none}
.g-code{font-family:var(--mono);font-size:11px;letter-spacing:0.14em;color:var(--accent)}
.g-code .tot{color:var(--faint)}
.g-controls{display:flex;gap:10px;pointer-events:auto;align-items:center}
.g-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,0.75);backdrop-filter:blur(6px);color:var(--ink);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .35s var(--ease)}
.g-btn:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.g-film{pointer-events:auto;font-family:var(--mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink);background:rgba(255,255,255,0.75);backdrop-filter:blur(6px);border:1px solid var(--line);padding:10px 15px;border-radius:999px;cursor:pointer;display:flex;gap:8px;align-items:center;transition:all .35s var(--ease)}
.g-film:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.g-progress{position:absolute;left:40px;right:40px;bottom:20px;height:1px;background:var(--line);z-index:6}
.g-progress i{position:absolute;left:0;top:0;height:100%;background:var(--accent);width:0}
/* ---- Builder: light WORK gallery, blue letters, Z-axis depth ---- */
.gallery.wk{background:#ecebe5;user-select:none;-webkit-user-select:none}
.gallery.wk::before{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(rgba(20,22,40,0.22) 1.3px,transparent 1.5px);background-size:26px 26px;opacity:.55}
.work-layer{position:absolute;inset:0;pointer-events:none;perspective:640px;perspective-origin:50% 50%;will-change:transform,perspective-origin;user-select:none;-webkit-user-select:none}
.work-layer.back{z-index:1}
.work-layer.front{z-index:5}
.work-row{position:absolute;left:0;top:calc(var(--row) * 25%);height:25%;display:block;white-space:nowrap;transform-style:preserve-3d;will-change:transform;backface-visibility:hidden;font-family:var(--sans);font-weight:800;font-size:23vh;line-height:1;letter-spacing:0.04em;color:#2f49d6;text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased;text-shadow:0 10px 0 rgba(20,28,80,0.30),0 22px 32px rgba(20,28,80,0.22);user-select:none;-webkit-user-select:none}
.gallery.wk .g-track{z-index:3;gap:29vw;padding:0 40vw;perspective:640px;perspective-origin:50% 50%}
.gallery.wk .g-item{transform-style:preserve-3d;backface-visibility:hidden}
.gallery.wk .curl,.gallery.wk .pcard{backface-visibility:hidden;transform:translateZ(0)}
.gallery.wk .work-row .wl{position:absolute;left:0;top:50%;display:block;will-change:transform;transform-origin:50% 50%;backface-visibility:hidden}
.gallery.wk .g-code{color:#2f49d6}
.gallery.wk .g-progress i{background:#2f49d6}
@media(max-width:680px){
  .g-bg{font-size:30vh}.g-track{padding:0 26vw;gap:9vw}.g-item{height:46vh}
  .work-row{font-size:15vh}
  .g-item.pi{height:54vh;width:80vw}
  .pcard-bar h3{font-size:18px}
  .g-name{left:20px;bottom:54px}
  .g-ui,.g-progress{left:20px;right:20px}
}

/* ============ investor ============ */
:root{--pos:#1f9d5b;--neg:#c2452f}
.inv-grid{display:grid;grid-template-columns:7fr 3fr;gap:52px;align-items:start;margin-bottom:30px}
/* performance — Robinhood-style slim chart */
.perf-head{margin-bottom:14px}
.perf-label{font-family:var(--mono);font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--faint)}
.perf-return{font-family:var(--serif);font-size:clamp(40px,5.5vw,62px);font-weight:600;letter-spacing:-0.025em;line-height:1.02;color:var(--pos);margin-top:10px}
.perf-return.down{color:var(--neg)}
.perf-sub{font-size:13px;color:var(--muted);margin-top:7px}
.chart{position:relative;margin-top:6px}
.chart-svg{width:100%;height:auto;display:block;overflow:visible}
.chart-svg .base{stroke:var(--line);stroke-width:1;stroke-dasharray:2 5}
.chart-svg .xlab{fill:var(--faint);font-family:var(--mono);font-size:10px;text-anchor:middle;letter-spacing:0.08em}
.chart-svg .cline{fill:none;stroke:var(--pos);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.chart-svg .cdot{fill:var(--pos)}
.chart-svg .cv{stroke:var(--ink);stroke-width:1;opacity:.18}
.chart-svg .ch{fill:#fff;stroke:var(--pos);stroke-width:2}
.chart-hit{position:absolute;inset:0;cursor:crosshair}
.ctip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:11px;line-height:1.45;padding:7px 10px;border-radius:8px;opacity:0;transform:translate(-50%,calc(-100% - 12px));white-space:nowrap;transition:opacity .12s;z-index:4}
.ctip b{color:#7fe0a8}
/* allocation — refined donut */
.alloc{position:sticky;top:84px}
.alloc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px}
.alloc-title{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-0.01em}
.alloc-toggle{width:34px;height:34px;border-radius:9px;border:none;background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .3s var(--ease),transform .3s var(--ease)}
.alloc-toggle:hover{background:transparent;color:var(--accent);transform:scale(1.08)}
.alloc-toggle svg{width:16px;height:16px;fill:currentColor}
.alloc-toggle .ic-pie{display:none}
.alloc.show-list .alloc-toggle .ic-list{display:none}
.alloc.show-list .alloc-toggle .ic-pie{display:block}
.alloc-body{display:flex;flex-direction:column;justify-content:center;height:360px;min-height:360px}
.alloc-body .legend{display:none}
.alloc.show-list .donut-box{display:none}
.alloc.show-list .alloc-body .legend{display:flex}
.donut-box{display:flex;justify-content:center;align-items:center;height:300px;min-height:300px}
.donut{position:relative;flex:0 0 auto}
.donut svg{transform:rotate(-90deg);display:block}
.donut .seg{fill:none;stroke-width:16;transition:stroke-width .35s var(--ease),opacity .35s var(--ease);cursor:pointer}
.donut.has-hover .seg{opacity:.26}
.donut.has-hover .seg.on{opacity:1;stroke-width:22}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.donut-center .big{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1}
.donut-center .sm{font-family:var(--mono);font-size:8.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--faint);margin-top:5px}
.legend{display:flex;flex-direction:column;justify-content:center;height:300px;min-height:300px}
.legend-row{display:grid;grid-template-columns:9px minmax(0,1fr) auto auto;gap:11px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line-soft);cursor:default;transition:background .2s}
.legend-row:last-child{border-bottom:none}
.legend-row:hover{background:var(--surface-2)}
.legend-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.l-tk{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:0.02em}
.l-ret{font-family:var(--mono);font-size:11px;text-align:right;color:var(--pos)}
.l-ret.down{color:var(--neg)}
.l-w{font-family:var(--mono);font-size:12px;font-weight:600;text-align:right;min-width:42px}
.note.fine{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:0.02em;line-height:1.7;margin:8px 0 56px;max-width:760px}
/* research — WSJ-style editorial */
.research-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:13px}
.research-head h3{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-0.02em}
.art-filter{display:flex;gap:20px;flex-wrap:wrap}
.fbtn{font-family:var(--mono);font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;background:none;border:none;color:var(--faint);cursor:pointer;padding:0 0 2px;position:relative;transition:color .3s}
.fbtn:hover{color:var(--ink)}
.fbtn.active{color:var(--ink)}
.fbtn.active::after{content:'';position:absolute;left:0;right:0;bottom:-15px;height:2px;background:var(--accent)}
.research-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 40px}
.art-card{cursor:pointer;border-top:1px solid var(--line);padding:22px 0 24px;display:flex;flex-direction:column;background:none}
.art-card .tk{font-family:var(--mono);font-size:10px;letter-spacing:0.12em;color:var(--accent);text-transform:uppercase;margin-bottom:9px}
.art-card h4{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-0.01em;line-height:1.2;margin-bottom:9px;transition:color .3s}
.art-card:hover h4{color:var(--accent)}
.art-card p{font-size:13px;color:var(--muted);line-height:1.6;flex:1}
.art-metrics{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0 1px}
.art-metrics span,.report-metrics span{font-family:var(--mono);font-size:9px;letter-spacing:0.07em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 8px}
.art-card .more{margin-top:14px;font-family:var(--mono);font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--faint)}
@media(max-width:920px){.inv-grid{grid-template-columns:1fr;gap:44px}.alloc{position:static}.research-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.research-grid{grid-template-columns:1fr}}

/* footer inside builder/investor views */
.vfoot{margin-top:90px;padding-top:26px;border-top:1px solid var(--line-soft);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;letter-spacing:0.07em;text-transform:uppercase;color:var(--faint)}
.vfoot a{transition:color .3s}.vfoot a:hover{color:var(--accent)}

/* ============ modal ============ */
.modal{position:fixed;inset:0;z-index:600;display:flex;justify-content:center;overflow-y:auto;background:rgba(18,15,10,0.42);backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:opacity .45s var(--ease)}
.modal.open{opacity:1;pointer-events:auto}
.sheet{position:relative;width:min(860px,100%);margin:auto;background:var(--surface);border-radius:22px;transform:translateY(34px) scale(.985);transition:transform .5s var(--ease-out);box-shadow:0 40px 100px rgba(0,0,0,.3)}
.modal.open .sheet{transform:none}
.sheet-media{position:relative;aspect-ratio:16/9;border-radius:22px 22px 0 0;overflow:hidden;background:var(--surface-2)}
.sheet-media img,.sheet-media iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:none}
.sheet-media .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:72px}
.sheet-close{position:absolute;top:16px;right:16px;z-index:5;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,0.94);color:var(--ink);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .35s var(--ease)}
.sheet-close:hover{transform:rotate(90deg)}
.sheet-body{padding:36px 42px 46px}
.sheet-body .mono{margin-bottom:12px}
.sheet-body h2{font-family:var(--serif);font-size:32px;font-weight:600;letter-spacing:-0.02em;margin-bottom:8px}
.sheet-body .sub{color:var(--muted);font-size:16.5px;margin-bottom:22px;line-height:1.55}
.sheet-body h5{font-family:var(--mono);font-size:10px;letter-spacing:0.13em;text-transform:uppercase;color:var(--faint);margin:26px 0 11px}
.sheet-body p{color:var(--ink-2);font-size:15px;line-height:1.75;margin-bottom:13px}
.sheet-body p.dim{color:var(--muted)}
.report-body{padding-top:46px}
.report-metrics{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 22px}
.report-label{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:24px 0 8px}
.source-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.source-list a{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border-bottom:1px solid currentColor;padding-bottom:2px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:0.03em;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:6px 12px;border-radius:999px}
.links{display:flex;flex-wrap:wrap;gap:11px;margin-top:24px}
.btn{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;padding:11px 19px;border-radius:999px;border:1px solid var(--line);transition:all .3s var(--ease)}
.btn:hover{border-color:var(--ink)}
.btn.fill{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.fill:hover{background:#000}
/* project detail: selected block expands, text block extends from the right */

.sheet.project-detail{width:min(1240px,calc(100vw - 84px));margin:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,370px);gap:0;background:rgba(255,255,255,.985);border:1px solid rgba(25,22,18,.08);border-radius:8px;box-shadow:0 48px 130px rgba(0,0,0,.34);overflow:hidden;transform:none;transition:none;will-change:transform,opacity;transform-origin:center}

.project-info .brief{font-size:13.5px;line-height:1.55;color:var(--ink-2);margin-bottom:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.project-info h5,.project-info .tags{display:none}
.project-info .links{margin-top:18px}
.project-detail .btn{padding:12px 18px;font-size:14px}

@media(max-width:860px){

function setView(name,push){
  if(!VIEWS.includes(name))name='builder';
  if(name===current)return;
  current=name;
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+name));
  tabs.forEach(t=>{const on=t.dataset.tab===name;t.classList.toggle('active',on);if(on)moveInk(t)});
  Object.keys(galleries).forEach(k=>galleries[k].deactivate());

/* ============ shared curled gallery (coverflow + parallax) ============ */
let galleries={};
function makeGallery({root,track,bg,front,frontParallax=0.6,bar,idxEl,nameEl,names,bgWord,parallax=0.36,onCenter,arc=false,rowsEls=null,rowsParallax=0.32,rowsTilt=0,infinite=false,loopCopies=1}){
  const items=[...track.children];
  const curls=items.map(it=>it.firstElementChild);
  const imgs=items.map(it=>it.querySelector('img'));
  const rowMetas=[];
  const G={target:0,cur:0,max:0};
  let metrics=[],mid=1,lastIdx=-1,active=false,rafing=false,inited=false,loopLen=0,loopOffset=0,snapTimer=0,lastDir=0;
  let dragging=false,dsx=0,dst=0,moved=0;
  function measure(){
    mid=root.clientWidth/2;
    metrics=items.map(it=>({l:it.offsetLeft,w:it.offsetWidth}));
    G.max=Math.max(0,track.scrollWidth-root.clientWidth);
    const copySize=infinite?Math.max(1,Math.floor(items.length/Math.max(1,loopCopies))):items.length;
    // for infinite scroll: loopLen = distance between one strip and the next clone
    loopLen = (infinite && metrics[copySize]) ? (metrics[copySize].l - metrics[0].l) : 0;
    if(!inited&&metrics.length){
      const initIndex=infinite&&loopCopies>1?copySize:0;
      const init = metrics[initIndex].l+metrics[initIndex].w/2-mid;
      G.cur = G.target = infinite ? init : clamp(init,0,G.max);
      inited=true;
    }
    if(!infinite) G.target=clamp(G.target,0,G.max);
    if(bg&&bgWord){bg.textContent=bgWord;const w=bg.scrollWidth||1;const need=G.max*parallax+root.clientWidth*1.5;const reps=Math.max(1,Math.ceil(need/(w+1)));bg.textContent=Array(reps).fill(bgWord).join(' ');}
    if(front&&bgWord)front.textContent=Array(16).fill(bgWord).join('  ');
    if(rowsEls){
      rowMetas.length=0;const ch_h=root.clientHeight;
      rowsEls.forEach(layer=>layer.querySelectorAll('.work-row').forEach(r=>{
        const ch=r.dataset.ch||'W',ri=+r.dataset.row||0,ry=ch_h*(ri*0.25+0.125);
        const speed=(ch==='O'||ch==='R')?rowsParallax*0.61:rowsParallax*0.45;
        const angle=(ch==='R'||ch==='K')?10.5:10.8,dir=(ch==='R'||ch==='K')?1:-1;
        r.textContent='';const probe=document.createElement('span');probe.className='wl';probe.textContent=ch;r.appendChild(probe);
        const lw=probe.offsetWidth||80,spacing=parseFloat(getComputedStyle(r).fontSize)*0.10,cell=lw+spacing;
        r.textContent='';
        const rowLetters=[];
        const rowReps=Math.max(10,Math.ceil(root.clientWidth/cell)+10);
        for(let k=0;k<rowReps;k++){const s=document.createElement('span');s.className='wl';s.textContent=ch;r.appendChild(s);rowLetters.push({el:s,bx:0,lw:lw});}
        rowLetters.forEach((L,k)=>{L.bx=k*cell;L.lw=L.el.offsetWidth||lw;});
        rowMetas.push({el:r,ch,ri,ry,speed,angle,dir,cell,span:rowReps*cell,pad:cell*3,letters:rowLetters});
      }));
    }
  }
  function itemTarget(i){const m=metrics[i];return m?m.l+m.w/2-mid:0}
  function snapToNearest(){
    if(!metrics.length)return;
    let bi=0,bd=1e9;
    const sorted=metrics.map((m,i)=>({i,t:itemTarget(i)})).sort((a,b)=>a.t-b.t);
    sorted.forEach(x=>{const d=Math.abs(x.t-G.target);if(d<bd){bd=d;bi=x.i;}});
    const t=itemTarget(bi),range=Math.max(180,mid*0.46);
    const pull=clamp(1-bd/range,0,1)*0.34;
    if(pull>0.04)G.target+=((infinite?t:clamp(t,0,G.max))-G.target)*pull;
  }
  function queueSnap(dir){lastDir=dir||lastDir;clearTimeout(snapTimer);snapTimer=setTimeout(snapToNearest,190)}
  function tick(){
    G.cur+=(G.target-G.cur)*0.105; if(Math.abs(G.target-G.cur)<0.06)G.cur=G.target;
    if(infinite&&loopLen>0){
      const low=loopCopies>2?loopLen*0.5:0,high=loopCopies>2?loopLen*1.5:loopLen;
      while(G.cur>=high){G.cur-=loopLen;G.target-=loopLen;loopOffset+=loopLen;}
      while(G.cur<low){G.cur+=loopLen;G.target+=loopLen;loopOffset-=loopLen;}
    }
    const visualCur=infinite?G.cur+loopOffset:G.cur;
    track.style.transform=`translate3d(${(-G.cur).toFixed(1)}px,0,0)`;
    if(bg)bg.style.transform=`translate3d(${(-G.cur*parallax).toFixed(1)}px,-50%,0)`;
    if(front)front.style.transform=`translate3d(${(-G.cur*frontParallax).toFixed(1)}px,0,0)`;
    if(rowsEls){
      // WORK rows keep independent phases so the wrapped project strip never snaps the letters.
      rowsEls.forEach(l=>{l.style.transform='';l.style.perspectiveOrigin='50% 50%';});
      const LDEPTH=140;
      rowMetas.forEach(row=>{
        const phase=visualCur*row.speed;
        row.el.style.transform='translate3d(0,0,0)';
        row.letters.forEach(L=>{
          const wrapped=((L.bx-phase)%row.span+row.span)%row.span-row.pad;
          const sx=wrapped+L.lw/2,ln=(sx-mid)/(mid||1),an=Math.min(Math.abs(ln),1);
          const tz=-LDEPTH*(1-an*an),rz=clamp(ln*row.angle*row.dir,-15,15);
          L.el.style.transform=`translate3d(${wrapped.toFixed(2)}px,-50%,${tz.toFixed(1)}px) rotateZ(${rz.toFixed(3)}deg)`;
        });
      });
    }
    if(bar)bar.style.width=(G.max?clamp(G.cur/G.max,0,1)*100:0)+'%';
    const DEPTH=320, BANG=18;
    if(arc)track.style.perspectiveOrigin=(mid+G.cur).toFixed(1)+'px 50%';
    let bi=0,bd=1e9;
    for(let i=0;i<items.length;i++){
      const m=metrics[i]; if(!m)continue;
      const cx=m.l-G.cur+m.w/2, d=(cx-mid)/(mid||1), ad=Math.min(Math.abs(d),1);
      const c=curls[i];
      if(arc){
        // elliptical Z-track: centre block faces viewer flat & nearest (z≈0); sides recede & tilt symmetrically
        const n=clamp(d,-1.8,1.8), an=Math.min(Math.abs(n),1);
        // block rides the SAME concave ellipse as the letters: centre = flat & farthest (smallest); sides = nearer & tilted
        const tz=-DEPTH*(1-an*an), rotY=clamp(-n*BANG*1.08,-31,31), op=1-Math.min(Math.abs(n),1)*0.04;
        const edge=Math.pow(Math.min(Math.abs(n),1.8)/1.8,1.55)*2.12;
        const warpN=Math.sign(n)*edge, dx=(warpN-n)*mid*0.5;
        if(c){c.style.transform=`translate3d(${dx.toFixed(1)}px,0,${tz.toFixed(0)}px) rotateY(${rotY.toFixed(2)}deg)`;c.style.opacity=op.toFixed(3);}
      }else{
        const rotY=clamp(-d*7,-8.5,8.5), sc=1-ad*0.12, op=1-ad*0.42, tz=-ad*60;
        if(c){c.style.transform=`rotateY(${rotY.toFixed(2)}deg) scale(${sc.toFixed(3)}) translateZ(${tz.toFixed(0)}px)`;c.style.opacity=op.toFixed(3);}
        const im=imgs[i]; if(im)im.style.transform=`scale(1.09) translateX(${(-d*18).toFixed(1)}px)`;
      }
      const dist=Math.abs(cx-mid); if(dist<bd){bd=dist;bi=i;}
    }
    if(bi!==lastIdx){lastIdx=bi;items.forEach((it,i)=>it.classList.toggle('is-center',i===bi));if(idxEl)idxEl.textContent=String(bi+1).padStart(2,'0');if(nameEl&&names)nameEl.textContent=names[bi]||'';if(onCenter)onCenter(bi);}
    if(active)requestAnimationFrame(tick); else rafing=false;
  }
  function start(){if(!rafing){rafing=true;requestAnimationFrame(tick);}}
  function stepTo(i){i=clamp(i,0,items.length-1);const m=metrics[i];if(m)G.target=infinite?itemTarget(i):clamp(itemTarget(i),0,G.max);}
  root.addEventListener('wheel',e=>{if(!active)return;e.preventDefault();const raw=Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX,dy=raw*0.86;G.target=infinite?(G.target+dy):clamp(G.target+dy,0,G.max);if(infinite)queueSnap(Math.sign(raw)||lastDir);},{passive:false});
  root.addEventListener('pointerdown',e=>{if(e.target.closest('.g-controls'))return;dragging=true;moved=0;dsx=e.clientX;dst=G.target;root.classList.add('drag');try{root.setPointerCapture(e.pointerId)}catch(_){}});
  root.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-dsx;moved+=Math.abs(dx);G.target=infinite?(dst-dx):clamp(dst-dx,0,G.max);if(infinite)lastDir=Math.sign(-dx)||lastDir;});
  function endDrag(){if(dragging&&infinite)queueSnap(lastDir);dragging=false;root.classList.remove('drag');}
  root.addEventListener('pointerup',endDrag);root.addEventListener('pointercancel',endDrag);
  return {activate(){active=true;measure();start();},deactivate(){active=false;},measure,stepTo,get index(){return lastIdx;},get moved(){return moved;}};
}

/* ============ investor: return chart ============ */
(function renderChart(){
  const box=$('#chart'); if(!box)return;
  $('#perfRet').textContent=`+${RET.total.toFixed(1)}%`;
  const W=1000,H=360,pL=6,pR=6,pT=22,pB=28;
  const xs=RET.dates.map(d=>new Date(d).getTime());
  const tmin=xs[0],tmax=xs[xs.length-1];
  const vmax=Math.max(...RET.vals)*1.06,vmin=0;
  const X=t=>pL+(t-tmin)/(tmax-tmin)*(W-pL-pR);
  const Y=v=>pT+(1-(v-vmin)/(vmax-vmin))*(H-pT-pB);
  const y0=Y(0);
  let seen={},ml='';
  RET.dates.forEach((d,i)=>{const mo=d.slice(0,7);if(!seen[mo]){seen[mo]=1;ml+=`<text class="xlab" x="${X(xs[i]).toFixed(1)}" y="${H-8}">${new Date(d).toLocaleDateString('en-US',{month:'short'})}</text>`;}});
  const pts=RET.vals.map((v,i)=>[X(xs[i]),Y(v)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${pts[pts.length-1][0].toFixed(1)} ${y0.toFixed(1)} L ${pts[0][0].toFixed(1)} ${y0.toFixed(1)} Z`;
  box.innerHTML=`<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--pos)" stop-opacity="0.10"/><stop offset="1" stop-color="var(--pos)" stop-opacity="0"/></linearGradient></defs><line class="base" x1="${pL}" y1="${y0.toFixed(1)}" x2="${W-pR}" y2="${y0.toFixed(1)}"/>${ml}<path d="${area}" fill="url(#ag)"/><path class="cline" d="${line}" vector-effect="non-scaling-stroke"/><circle class="cdot" cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3.4"/><g id="chov" style="opacity:0"><line class="cv" x1="0" x2="0" y1="${pT}" y2="${(H-pB).toFixed(1)}" vector-effect="non-scaling-stroke"/><circle class="ch" r="4.6"/></g></svg><div class="chart-hit" id="chit"></div><div class="ctip" id="ctip"></div>`;
  const hov=box.querySelector('#chov'),cv=hov.querySelector('.cv'),ch=hov.querySelector('.ch'),tip=$('#ctip'),hit=$('#chit');
  hit.addEventListener('mousemove',e=>{
    const r=hit.getBoundingClientRect(),vbx=(e.clientX-r.left)/r.width*W;
    let bi=0,bd=1e9;xs.forEach((t,i)=>{const dd=Math.abs(X(t)-vbx);if(dd<bd){bd=dd;bi=i}});
    const x=X(xs[bi]),y=Y(RET.vals[bi]);
    hov.style.opacity='1';cv.setAttribute('x1',x);cv.setAttribute('x2',x);ch.setAttribute('cx',x);ch.setAttribute('cy',y);
    tip.style.opacity='1';tip.style.left=(x/W*r.width)+'px';tip.style.top=(y/H*r.height)+'px';
    const v=RET.vals[bi];tip.innerHTML=`${new Date(RET.dates[bi]).toLocaleDateString('en-US',{month:'short',day:'numeric'})} &nbsp;<b>${v>=0?'+':''}${v.toFixed(1)}%</b>`;
  });
  hit.addEventListener('mouseleave',()=>{hov.style.opacity='0';tip.style.opacity='0'});
})();

/* ============ investor donut + legend ============ */
const R=80,C=2*Math.PI*R,GAP=4,donut=$('#donut');
let off=0,seg='';
HOLDINGS.forEach((h,i)=>{const len=h.w/100*C;seg+=`<circle class="seg" data-i="${i}" r="${R}" cx="100" cy="100" stroke="${h.color}" stroke-dasharray="${Math.max(0,len-GAP).toFixed(2)} ${(C-Math.max(0,len-GAP)).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"></circle>`;off+=len});
donut.innerHTML=`<svg width="200" height="200" viewBox="0 0 200 200">${seg}</svg><div class="donut-center"><span class="big" id="dBig">${HOLDINGS.length}</span><span class="sm" id="dSm">holdings</span></div>`;
const legend=$('#legend');
HOLDINGS.forEach((h,i)=>{
  const rc=h.ret>=0?'':'down',rt=`${h.ret>=0?'+':''}${h.ret}%`;
  const li=ce('div');li.className='legend-row';li.dataset.i=i;
  li.innerHTML=`<span class="legend-dot" style="background:${h.color}"></span><span class="l-tk">${h.t}</span><span class="l-ret ${rc}">${rt}</span><span class="l-w">${h.w}%</span>`;
  legend.appendChild(li);
});
const segs=[...donut.querySelectorAll('.seg')],legs=[...legend.querySelectorAll('.legend-row')],dBig=$('#dBig'),dSm=$('#dSm');
function hov(i){donut.classList.add('has-hover');segs.forEach(s=>s.classList.toggle('on',+s.dataset.i===i));legs.forEach(l=>l.style.background=+l.dataset.i===i?'var(--surface-2)':'');dBig.textContent=HOLDINGS[i].w+'%';dSm.textContent=HOLDINGS[i].t}
function unhov(){donut.classList.remove('has-hover');segs.forEach(s=>s.classList.remove('on'));legs.forEach(l=>l.style.background='');dBig.textContent=HOLDINGS.length;dSm.textContent='holdings'}
segs.concat(legs).forEach(el=>{el.addEventListener('mouseenter',()=>hov(+el.dataset.i));el.addEventListener('mouseleave',unhov)});
const an=$('#allocNote');if(an)an.textContent='Started Jan 1, 2026 at target weights. Current weights reflect price drift; leveraged products amplify both upside and drawdowns. For information only, not investment advice.';
const allocEl=document.querySelector('.alloc'),allocToggle=$('#allocToggle');
if(allocToggle)allocToggle.addEventListener('click',()=>allocEl.classList.toggle('show-list'));

/* ============ articles ============ */
const cats=['All',...new Set(ARTICLES.map(a=>a.cat))],filter=$('#artFilter'),agrid=$('#artGrid');
cats.forEach((c,i)=>{const b=ce('button');b.className='fbtn'+(i===0?' active':'');b.textContent=c;b.addEventListener('click',()=>{filter.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderArticles(c)});filter.appendChild(b)});

/* ============ modal ============ */
const modal=$('#modal'),sheet=$('#sheet');
function animateProjectOpen(from){
  if(!from)return;
  const to=sheet.getBoundingClientRect();
  const dx=from.left+from.width/2-(to.left+to.width/2),dy=from.top+from.height/2-(to.top+to.height/2);
  const sx=from.width/to.width,sy=from.height/to.height;
  sheet.style.opacity='1';
  sheet.animate([
    {transform:`translate3d(${dx}px,${dy}px,0) scale(${sx},${sy})`,opacity:.96,borderRadius:'6px'},
    {transform:'translate3d(0,0,0) scale(1)',opacity:1,borderRadius:'8px'}
  ],{duration:720,easing:'cubic-bezier(.16,1,.3,1)',fill:'both'});
  const info=sheet.querySelector('.project-info');
  if(info)info.animate([{transform:'translateX(54px)',opacity:0},{transform:'translateX(0)',opacity:1}],{duration:620,delay:150,easing:'cubic-bezier(.16,1,.3,1)',fill:'both'});
}
function showModal(html,cls,originEl){
  modal.className='modal'+(cls?' '+cls:'');
  sheet.className='sheet'+(cls==='light'?' lb':cls==='project'?' project-detail':'');
  sheet.getAnimations().forEach(a=>a.cancel());
  sheet.style.opacity='';
  const from=originEl?(originEl.querySelector('.pcard')||originEl).getBoundingClientRect():null;
  if(cls==='project'&&from)sheet.style.opacity='0';
  sheet.innerHTML=`<button class="sheet-close" aria-label="Close">✕</button>`+html;
  sheet.querySelector('.sheet-close').addEventListener('click',closeModal);
  requestAnimationFrame(()=>{modal.classList.add('open');if(cls==='project'&&from)requestAnimationFrame(()=>animateProjectOpen(from));});
  document.body.style.overflow='hidden';
}
function closeModal(){sheet.getAnimations().forEach(a=>a.cancel());modal.classList.remove('open');document.body.style.overflow='';setTimeout(()=>{if(!modal.classList.contains('open'))sheet.innerHTML='';},520)}
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function openProject(p,originEl){
  const ar=p.r||1.778;
  const media=p.soon?`<div class="project-hero" style="--media-ar:${ar}"><div class="ph">${p.emoji||'—'}</div></div>`
    :p.youtube?`<div class="project-hero" style="--media-ar:${ar}"><iframe src="https://www.youtube.com/embed/${p.youtube}" title="${p.title}" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen frameborder="0"></iframe></div>`
    :`<div class="project-hero" style="--media-ar:${ar}"><img src="${p.cover}" alt="${p.title}"></div>`;
  const links=(p.links||[]).map(l=>`<a class="btn ${l.fill?'fill':''}" href="${l.url}" target="_blank" rel="noopener">${l.label} ↗</a>`).join('');
  const brief=`<p class="brief">${(p.body&&p.body[0])||p.sub}</p>`;
  showModal(`${media}<aside class="project-info"><span class="mono">${p.meta}${p.soon?' · Coming soon':''}</span><h2>${p.title}</h2><p class="sub">${p.sub}</p>${brief}<h5>Stack</h5><div class="tags">${(p.stack||[]).map(s=>`<span class="tag">${s}</span>`).join('')}</div>${links?`<div class="links">${links}</div>`:''}</aside>`,'project',originEl);
}
function openArticle(a){
  const metrics=(a.metrics||[]).map(m=>`<span>${m}</span>`).join('');
  const sources=(a.sources||[]).map(s=>`<a href="${s.url}" target="_blank" rel="noopener">${s.label}</a>`).join('');
  showModal(`<div class="sheet-body report-body"><span class="mono">${a.tk} · ${a.cat} Equity Research</span><h2>${a.title}</h2><p class="sub">${a.blurb}</p><div class="report-metrics">${metrics}</div>${a.body.map(t=>`<p>${t}</p>`).join('')}<div class="report-label">Sources</div><div class="source-list">${sources}</div><p class="dim note">For information only. Leveraged and thematic products can lose value rapidly and require active risk management.</p></div>`)
}
function openPainting(p){showModal(`<img src="${p.src}" alt="${p.title}"><div class="lb-cap"><h4>${p.title}</h4><span>Oil on canvas · ${p.year}</span></div>`,'light')}
/* cinematic film mode — gallery darkens & images fade, video projects in */
const cinema=$('#cinema'),cinemaStage=$('#cinemaStage'),cGallery=$('#gallery');
function openFilm(){
  cGallery.classList.add('film');           // background darkens + image blocks fade out
  document.body.classList.add('film-on');   // header turns black, brand/tabs/icons fade out
  if(galleries.creator)galleries.creator.deactivate();
  // Inject iframe NOW (within the click's user-gesture window) so autoplay isn't blocked.
  cinemaStage.innerHTML=`<iframe src="https://www.youtube.com/embed/ayd-vBqCWs0?rel=0&modestbranding=1&autoplay=1&playsinline=1&enablejsapi=1" title="AI Short Film — Jiayang Wen" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen frameborder="0"></iframe>`;
  cinema.classList.add('on');cinema.setAttribute('aria-hidden','false');
}
function closeFilm(){
  cinema.classList.remove('on');cinema.setAttribute('aria-hidden','true');
  cGallery.classList.remove('film');         // background lightens + image blocks fade in
  document.body.classList.remove('film-on'); // header fades back to default
  clearTimeout(cinema._t);
  setTimeout(()=>{cinemaStage.innerHTML='';},600);
  if(current==='creator'&&galleries.creator)galleries.creator.activate();
}
$('#cinemaExit').addEventListener('click',closeFilm);
addEventListener('keydown',e=>{if(e.key==='Escape'&&cinema.classList.contains('on'))closeFilm()});

/* ============ boot ============ */
function boot(){
  const a=tabs.find(t=>t.classList.contains('active'))||tabs[0];moveInk(a);
  setView((location.hash||'#builder').slice(1),false);
}
if(document.readyState!=='loading')boot(); else addEventListener('DOMContentLoaded',boot);
addEventListener('load',()=>{const a=tabs.find(t=>t.dataset.tab===current);if(a)moveInk(a);const g=galleries[current];if(g)g.measure()});
</script>
